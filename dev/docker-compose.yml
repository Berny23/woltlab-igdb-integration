name: woltlab-dev

services:
  php:
    build: ./php
    restart: unless-stopped
    volumes:
      - woltlab:/var/www/html
      - ./php/woltlab.ini:/usr/local/etc/php/conf.d/woltlab.ini:ro
      # Plugin source for the ACP developer tools
      - ../src:/var/www/plugin-src:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      # Rootless podman needs:
      # net.ipv4.ip_unprivileged_port_start=80
      # The site is served as http://woltlab.localhost (*.localhost resolves
      # to ::1 via systemd-resolved, hence the IPv6 binding); the bare
      # "localhost" hostname is rejected by Steam's WAF during OpenID login.
      - "127.0.0.1:80:80"
      - "[::1]:80:80"
    volumes:
      - woltlab:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: woltlab
      MARIADB_USER: woltlab
      MARIADB_PASSWORD: woltlab
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  woltlab:
  db:
